<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Pitch Training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .menu-buttons {
            display: grid;
            gap: 15px;
            margin-top: 30px;
        }

        .menu-btn, .action-btn, .back-btn, .settings-btn {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .menu-btn {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .menu-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .settings-btn {
            background: #ed8936;
            color: white;
            box-shadow: 0 4px 15px rgba(237, 137, 54, 0.4);
        }

        .settings-btn:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(237, 137, 54, 0.6);
        }

        .action-btn {
            background: #48bb78;
            color: white;
            font-size: 1.5em;
            padding: 30px;
            margin: 30px 0;
        }

        .action-btn:hover {
            background: #38a169;
            transform: scale(1.05);
        }

        .back-btn {
            background: #e2e8f0;
            color: #4a5568;
            padding: 12px 24px;
            font-size: 1em;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: #cbd5e0;
        }

        .input-section {
            margin: 30px 0;
        }

        .input-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-grid.vertical {
            grid-template-columns: 1fr;
        }

        input, select {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1em;
            text-align: center;
        }

        input[type="text"] {
            text-transform: lowercase;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-btn, .save-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover, .save-btn:hover {
            background: #5568d3;
        }

        .result {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.correct {
            background: #c6f6d5;
            color: #22543d;
        }

        .result.incorrect {
            background: #fed7d7;
            color: #742a2a;
        }

        .answer-text {
            margin-top: 10px;
            font-size: 1em;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .settings-section {
            margin: 20px 0;
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-label {
            display: block;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 8px;
            font-size: 1em;
        }

        .setting-info {
            font-size: 0.9em;
            color: #718096;
            margin-top: 5px;
        }

        .frequency-display {
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background: #f7fafc;
            border-radius: 8px;
            color: #4a5568;
            font-size: 0.95em;
        }

        .current-range {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #e6fffa;
            border-radius: 8px;
            color: #234e52;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Home Screen -->
        <div id="homeScreen" class="screen active">
            <h1>🎵 Perfect Pitch Training</h1>
            <p class="subtitle">Choose your training mode</p>
            
            <div class="menu-buttons">
                <button class="menu-btn" onclick="goToMode('single')">Single Note</button>
                <button class="menu-btn" onclick="goToMode('double')">2 Notes</button>
                <button class="menu-btn" onclick="goToMode('triple')">3 Notes</button>
                <button class="menu-btn" onclick="goToMode('chord')">Chord</button>
                <button class="settings-btn" onclick="goToSettings()">⚙️ Settings</button>
            </div>
        </div>

        <!-- Settings Screen -->
        <div id="settingsScreen" class="screen">
            <h1>⚙️ Settings</h1>
            <p class="subtitle">Customize frequency range</p>

            <div class="settings-section">
                <div class="setting-item">
                    <label class="setting-label" for="minNote">Minimum Note</label>
                    <select id="minNote" onchange="updateFrequencyDisplay()">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                    <div class="setting-info">Lowest note that can appear</div>
                </div>

                <div class="setting-item">
                    <label class="setting-label" for="maxNote">Maximum Note</label>
                    <select id="maxNote" onchange="updateFrequencyDisplay()">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                    <div class="setting-info">Highest note that can appear</div>
                </div>

                <div class="frequency-display" id="frequencyDisplay">
                    <!-- Frequency info will be shown here -->
                </div>
            </div>

            <button class="save-btn" onclick="saveSettings()">Save Settings</button>
            <button class="back-btn" onclick="goHome()">← Back to Menu</button>
        </div>

        <!-- Training Screen -->
        <div id="trainingScreen" class="screen">
            <h1 id="modeTitle">Single Note</h1>
            <p class="subtitle" id="modeSubtitle">Listen and identify the note</p>
            <div class="current-range" id="currentRange"></div>

            <button class="action-btn" onclick="playCurrentSound()">🔊 Play Sound</button>

            <div class="input-section">
                <div id="inputContainer"></div>
                <button class="submit-btn" onclick="checkAnswer()">Submit Answer</button>
            </div>

            <div id="result" class="result"></div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">Correct</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="accuracy">0%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
            </div>

            <button class="back-btn" onclick="goHome()">← Back to Menu</button>
        </div>
    </div>

    <script>
        let audioContext = null;
        const notes = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
        
        // Default settings: A0(21) to C8(108)
        let minMidiNote = 21; // A0
        let maxMidiNote = 108; // C8
        
        const chords = {
            'c major': ['c4', 'e4', 'g4'],
            'd major': ['d4', 'f#4', 'a4'],
            'e major': ['e4', 'g#4', 'b4'],
            'f major': ['f4', 'a4', 'c5'],
            'g major': ['g4', 'b4', 'd5'],
            'a major': ['a4', 'c#5', 'e5'],
            'c minor': ['c4', 'd#4', 'g4'],
            'd minor': ['d4', 'f4', 'a4'],
            'e minor': ['e4', 'g4', 'b4'],
            'a minor': ['a4', 'c5', 'e5']
        };

        let currentMode = 'single';
        let currentAnswer = [];
        let correctCount = 0;
        let totalCount = 0;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }
        }

        // Convert MIDI note number to frequency (A4=440Hz reference)
        function midiToFrequency(midiNote) {
            return 440 * Math.pow(2, (midiNote - 69) / 12);
        }

        // Convert MIDI note number to note name
        function midiToNoteName(midiNote) {
            const octave = Math.floor(midiNote / 12) - 1;
            const noteIndex = midiNote % 12;
            return notes[noteIndex] + octave;
        }

        // Convert note name to MIDI note number
        function noteNameToMidi(noteName) {
            const match = noteName.match(/([a-g]#?)(\d)/);
            if (!match) return null;
            const note = match[1];
            const octave = parseInt(match[2]);
            const noteIndex = notes.indexOf(note);
            if (noteIndex === -1) return null;
            return (octave + 1) * 12 + noteIndex;
        }

        // Generate random MIDI note
        function getRandomMidiNote() {
            return Math.floor(Math.random() * (maxMidiNote - minMidiNote + 1)) + minMidiNote;
        }

        function noteToFrequency(note) {
            const noteMatch = note.match(/([a-g]#?)(\d)/);
            if (!noteMatch) return 0;
            
            const noteName = noteMatch[1];
            const octave = parseInt(noteMatch[2]);
            const noteIndex = notes.indexOf(noteName);
            const midiNote = (octave + 1) * 12 + noteIndex;
            return midiToFrequency(midiNote);
        }

        function playNote(frequency, startTime = 0, duration = 1) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            
            const now = audioContext.currentTime;
            gainNode.gain.setValueAtTime(0, now + startTime);
            gainNode.gain.linearRampToValueAtTime(0.3, now + startTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + startTime + duration);
            
            oscillator.start(now + startTime);
            oscillator.stop(now + startTime + duration);
        }

        function generateQuestion() {
            currentAnswer = [];
            
            if (currentMode === 'single') {
                const midiNote = getRandomMidiNote();
                currentAnswer = [midiToNoteName(midiNote)];
            } else if (currentMode === 'double') {
                for (let i = 0; i < 2; i++) {
                    const midiNote = getRandomMidiNote();
                    currentAnswer.push(midiToNoteName(midiNote));
                }
            } else if (currentMode === 'triple') {
                for (let i = 0; i < 3; i++) {
                    const midiNote = getRandomMidiNote();
                    currentAnswer.push(midiToNoteName(midiNote));
                }
            } else if (currentMode === 'chord') {
                const chordNames = Object.keys(chords);
                const randomChord = chordNames[Math.floor(Math.random() * chordNames.length)];
                currentAnswer = [randomChord];
            }
        }

        function playCurrentSound() {
            initAudio();
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            if (currentMode === 'chord') {
                const chordName = currentAnswer[0];
                const chordNotes = chords[chordName];
                chordNotes.forEach(note => {
                    playNote(noteToFrequency(note), 0, 2);
                });
            } else if (currentMode === 'single') {
                playNote(noteToFrequency(currentAnswer[0]), 0, 1);
            } else {
                currentAnswer.forEach(note => {
                    playNote(noteToFrequency(note), 0, 1.5);
                });
            }
        }

        function setupInputs() {
            const container = document.getElementById('inputContainer');
            container.innerHTML = '';
            
            if (currentMode === 'chord') {
                container.innerHTML = '<div class="input-grid vertical"><input type="text" id="input0" placeholder="e.g., c major"></div>';
            } else {
                const count = currentMode === 'single' ? 1 : currentMode === 'double' ? 2 : 3;
                container.innerHTML = `<div class="input-grid vertical">` +
                    Array.from({length: count}, (_, i) => 
                        `<input type="text" id="input${i}" placeholder="note ${i + 1} (e.g., a#3)">`
                    ).join('') +
                    '</div>';
            }

            // Add event listeners to ensure lowercase input
            container.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', (e) => {
                    e.target.value = e.target.value.toLowerCase();
                });
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') checkAnswer();
                });
            });
        }

        function checkAnswer() {
            const resultDiv = document.getElementById('result');
            let userAnswer = [];
            
            if (currentMode === 'chord') {
                userAnswer = [document.getElementById('input0').value.trim().toLowerCase()];
            } else {
                const count = currentMode === 'single' ? 1 : currentMode === 'double' ? 2 : 3;
                for (let i = 0; i < count; i++) {
                    const val = document.getElementById(`input${i}`).value.trim().toLowerCase();
                    if (val) userAnswer.push(val);
                }
            }

            if (userAnswer.length === 0 || userAnswer.some(a => !a)) {
                alert('Please enter all answers');
                return;
            }

            totalCount++;
            let isCorrect = false;

            if (currentMode === 'chord') {
                isCorrect = userAnswer[0] === currentAnswer[0];
            } else {
                isCorrect = JSON.stringify(userAnswer.sort()) === JSON.stringify(currentAnswer.sort());
            }

            if (isCorrect) {
                correctCount++;
                resultDiv.className = 'result correct show';
                resultDiv.innerHTML = `✓ Correct!<div class="answer-text">Answer: ${currentAnswer.join(', ')}</div>`;
            } else {
                resultDiv.className = 'result incorrect show';
                resultDiv.innerHTML = `✗ Incorrect<div class="answer-text">Correct answer: ${currentAnswer.join(', ')}</div>`;
            }

            updateStats();
            
            setTimeout(() => {
                resultDiv.className = 'result';
                generateQuestion();
                setupInputs();
            }, 3000);
        }

        function updateStats() {
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('totalCount').textContent = totalCount;
            const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function updateCurrentRange() {
            const rangeDisplay = document.getElementById('currentRange');
            const minNote = midiToNoteName(minMidiNote);
            const maxNote = midiToNoteName(maxMidiNote);
            const minFreq = Math.round(midiToFrequency(minMidiNote) * 10) / 10;
            const maxFreq = Math.round(midiToFrequency(maxMidiNote) * 10) / 10;
            rangeDisplay.textContent = `Range: ${minNote} (${minFreq}Hz) - ${maxNote} (${maxFreq}Hz)`;
        }

        function goToMode(mode) {
            currentMode = mode;
            
            const titles = {
                'single': 'Single Note',
                'double': '2 Notes',
                'triple': '3 Notes',
                'chord': 'Chord'
            };
            
            const subtitles = {
                'single': 'Listen and identify the note',
                'double': 'Listen and identify both notes (played simultaneously)',
                'triple': 'Listen and identify all three notes (played simultaneously)',
                'chord': 'Listen and identify the chord'
            };
            
            document.getElementById('modeTitle').textContent = titles[mode];
            document.getElementById('modeSubtitle').textContent = subtitles[mode];
            
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('trainingScreen').classList.add('active');
            
            updateCurrentRange();
            generateQuestion();
            setupInputs();
            document.getElementById('result').className = 'result';
        }

        function goHome() {
            document.getElementById('trainingScreen').classList.remove('active');
            document.getElementById('settingsScreen').classList.remove('active');
            document.getElementById('homeScreen').classList.add('active');
            correctCount = 0;
            totalCount = 0;
            updateStats();
        }

        function goToSettings() {
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('settingsScreen').classList.add('active');
            populateNoteSelectors();
            updateFrequencyDisplay();
        }

        function populateNoteSelectors() {
            const minSelect = document.getElementById('minNote');
            const maxSelect = document.getElementById('maxNote');
            
            minSelect.innerHTML = '';
            maxSelect.innerHTML = '';
            
            // Generate all notes from A0(21) to C8(108)
            for (let midi = 21; midi <= 108; midi++) {
                const noteName = midiToNoteName(midi);
                const freq = Math.round(midiToFrequency(midi) * 10) / 10;
                
                const minOption = document.createElement('option');
                minOption.value = midi;
                minOption.textContent = `${noteName} (${freq}Hz)`;
                if (midi === minMidiNote) minOption.selected = true;
                minSelect.appendChild(minOption);
                
                const maxOption = document.createElement('option');
                maxOption.value = midi;
                maxOption.textContent = `${noteName} (${freq}Hz)`;
                if (midi === maxMidiNote) maxOption.selected = true;
                maxSelect.appendChild(maxOption);
            }
        }

        function updateFrequencyDisplay() {
            const minSelect = document.getElementById('minNote');
            const maxSelect = document.getElementById('maxNote');
            const display = document.getElementById('frequencyDisplay');
            
            const minMidi = parseInt(minSelect.value);
            const maxMidi = parseInt(maxSelect.value);
            
            const minNote = midiToNoteName(minMidi);
            const maxNote = midiToNoteName(maxMidi);
            const minFreq = Math.round(midiToFrequency(minMidi) * 10) / 10;
            const maxFreq = Math.round(midiToFrequency(maxMidi) * 10) / 10;
            
            if (minMidi > maxMidi) {
                display.innerHTML = '<strong style="color: #e53e3e;">⚠️ Minimum note must be lower than maximum note</strong>';
            } else {
                display.innerHTML = `
                    <strong>Current Range:</strong><br>
                    ${minNote} (${minFreq}Hz) to ${maxNote} (${maxFreq}Hz)<br>
                    <span style="color: #718096;">Total notes: ${maxMidi - minMidi + 1}</span>
                `;
            }
        }

        function saveSettings() {
            const minSelect = document.getElementById('minNote');
            const maxSelect = document.getElementById('maxNote');
            
            const newMin = parseInt(minSelect.value);
            const newMax = parseInt(maxSelect.value);
            
            if (newMin > newMax) {
                alert('Minimum note must be lower than or equal to maximum note');
                return;
            }
            
            minMidiNote = newMin;
            maxMidiNote = newMax;
            
            // Save settings to localStorage
            localStorage.setItem('minMidiNote', minMidiNote);
            localStorage.setItem('maxMidiNote', maxMidiNote);
            
            alert('Settings saved successfully!');
            goHome();
        }

        // Load saved settings
        function loadSettings() {
            const savedMin = localStorage.getItem('minMidiNote');
            const savedMax = localStorage.getItem('maxMidiNote');
            
            if (savedMin !== null) minMidiNote = parseInt(savedMin);
            if (savedMax !== null) maxMidiNote = parseInt(savedMax);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            document.body.addEventListener('click', initAudio, { once: true });
            document.body.addEventListener('touchstart', initAudio, { once: true });
        });
    </script>
</body>
</html>
